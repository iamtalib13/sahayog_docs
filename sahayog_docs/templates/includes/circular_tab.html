<!-- Sub-tabs -->
<ul class="nav nav-tabs mb-3" id="circular-subtabs" role="tablist">
  <li class="nav-item" role="presentation">
    <a
      href="#"
      class="nav-link active"
      hx-get="/circular-tab?filter=all"
      hx-target="#circular-cards"
      hx-trigger="click"
      role="tab"
      >All</a
    >
  </li>
  <li class="nav-item" role="presentation">
    <a
      href="#"
      class="nav-link"
      hx-get="/circular-tab?filter=circular"
      hx-target="#circular-cards"
      hx-trigger="click"
      role="tab"
      >Circulars</a
    >
  </li>
  <li class="nav-item" role="presentation">
    <a
      href="#"
      class="nav-link"
      hx-get="/circular-tab?filter=process"
      hx-target="#circular-cards"
      hx-trigger="click"
      role="tab"
      >Process & Policies</a
    >
  </li>
</ul>

<!-- Filters -->
<form
  id="filters-form"
  class="row mb-4"
  hx-get="/circular-tab"
  hx-target="#circular-cards"
  hx-trigger="change"
  hx-include="#filters-form"
>
  <div class="col-md-3">
    <label for="year" class="form-label">Year</label>
    <select name="year" id="year" class="form-select">
      {% set current_year = frappe.utils.now_datetime().year %} {% for y in
      range(current_year, current_year - 6, -1) %}
      <option value="{{ y }}">{{ y }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-3">
    <label for="month" class="form-label">Month</label>
    <select name="month" id="month" class="form-select">
      <option value="">All</option>
      {% for m in range(1, 13) %}
      <option value="{{ '%02d'|format(m) }}">
        {{ frappe.utils.formatdate('2025-' ~ m ~ '-01', 'MMMM') }}
      </option>
      {% endfor %}
    </select>
  </div>
</form>

<!-- Cards Container -->
<div id="circular-cards">
  <!-- Initial cards load here -->
  {% include "templates/includes/portal/circular_cards.html" %}
</div>
